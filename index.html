    function calculateEmotions(blendshapes, landmarks) {
      const getScore = (name) => {
        const item = blendshapes.find(b => b.categoryName === name);
        return Number.isFinite(item?.score) ? Math.max(0,Math.min(1,item.score)) : 0;
      };
      
      const smile = (getScore('mouthSmileLeft') + getScore('mouthSmileRight')) / 2;
      const cheek = (getScore('cheekSquintLeft') + getScore('cheekSquintRight')) / 2;
      const jawOpen = getScore('jawOpen');
      const browInnerUp = getScore('browInnerUp'); 
      const browOuterUp = (getScore('browOuterUpLeft') + getScore('browOuterUpRight')) / 2;
      const lipPress = (getScore('mouthPressLeft') + getScore('mouthPressRight')) / 2;
      const browAsymmetry = Math.abs(getScore('browOuterUpLeft') - getScore('browOuterUpRight'));
      const mouthAsymmetry = Math.abs(getScore('mouthSmileLeft') - getScore('mouthSmileRight'));
      const noseSneer = (getScore('noseSneerLeft') + getScore('noseSneerRight')) / 2; 

      let geometricBrowDown = 0;
      let geometricEyeNarrow = 0;
      let geometricLipThin = 0;

      if (landmarks && [159,145,386,374,55,285,13,14,61,291].every(i=>Number.isFinite(landmarks[i]?.x)&&Number.isFinite(landmarks[i]?.y))) {
        const dist = (p1, p2) => {
          return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        };

        const leftEyeHeight = dist(landmarks[159], landmarks[145]);
        const rightEyeHeight = dist(landmarks[386], landmarks[374]);
        const leftBrowDist = dist(landmarks[159], landmarks[55]);
        const rightBrowDist = dist(landmarks[386], landmarks[285]);
        const mouthHeight = dist(landmarks[13], landmarks[14]);
        const mouthWidth = dist(landmarks[61], landmarks[291]);

        const eyeToBrowRatio = (leftBrowDist + rightBrowDist) / 2;
        const mouthRatio = mouthHeight / (mouthWidth || 1);

        // 恢复敏感度：只要距离小于 0.042 就算皱眉，快速响应
        if (eyeToBrowRatio < 0.042) {
          geometricBrowDown = Math.min(1, (0.042 - eyeToBrowRatio) / 0.015); 
        }

        // 眼睛眯起
        if ((leftEyeHeight + rightEyeHeight) / 2 < 0.011) {
          geometricEyeNarrow = 0.6; 
        }

        // 嘴唇紧闭
        if (mouthRatio < 0.07) {
          geometricLipThin = 0.5;
        }
      }

      rawSmileEl.textContent = smile.toFixed(2);
      rawBrowUpEl.textContent = (browInnerUp + browOuterUp).toFixed(2);
      rawBrowDownEl.textContent = (getScore('browDownLeft') + geometricBrowDown).toFixed(2);

      // 降低触发门槛，动作稍微做一点就能检测到
      let happy = 0;
      if (smile > 0.1) happy = (smile * 0.8) + (cheek * 0.2); // 从 0.2 降到 0.1

      let surprise = 0;
      if (jawOpen > 0.15 && (browOuterUp > 0.1 || browInnerUp > 0.1)) { // 从 0.25 降到 0.15
        surprise = (jawOpen * 0.5) + (browOuterUp * 0.25) + (browInnerUp * 0.25);
      }

      const mediaPipeBrowDown = (getScore('browDownLeft') + getScore('browDownRight')) / 2;
      let angry = 0;
      if (mediaPipeBrowDown > 0.05 || geometricBrowDown > 0.15) { // 从 0.1 降到 0.05
        angry = (mediaPipeBrowDown * 0.4) + (geometricBrowDown * 0.4) + (lipPress * 0.1) + (geometricLipThin * 0.1);
      }
      angry = Math.min(1, angry * 1.2); // 增加一点愤怒的权重

      const ramp=(v,d,f)=>Math.pow(Math.max(0,Math.min(1,(v-d)/(f-d))),0.7);
      const confused=0.8*ramp(Math.max(browInnerUp,browOuterUp),0.015,0.22)+0.2*ramp(browAsymmetry,0.015,0.16);
      // Neutral 的退让逻辑：只要有任何表情，Neutral 就迅速让位
      const maxOther = Math.max(happy, surprise, angry, confused);
      let neutral = 0.6; 
      
      if (maxOther > 0.05) {
        neutral = Math.max(0.05, 1 - (maxOther * 2.5)); // 乘数变大，Neutral 掉得更快
      }

      const rawScores = { happy, surprise, confused, angry, neutral };
      
      let sum = Object.values(rawScores).reduce((a, b) => a + b, 0);
      if (sum === 0) sum = 1;
      
      const finalScores = {};
      for (const key in rawScores) {
        finalScores[key] = (rawScores[key] / sum) * 100;
      }
      return finalScores;
    }

 beforeReportDone=false;layer.hidden=false;video.currentTime=0;
 const begin=async()=>{try{await video.play();resume.hidden=true;video.style.opacity='1';startReportMusic()}catch(e){resume.hidden=false}};
 resume.onclick=begin;
 const finish=()=>{if(beforeReportDone)return;beforeReportDone=true;layer.style.background="url('./assets/report/texture.jpg') center/cover";video.style.transition='opacity 3s ease';video.style.opacity='0';setTimeout(()=>{video.pause();layer.hidden=true;showReport()},3050)};
 video.onended=finish;video.onerror=()=>{resume.hidden=false;resume.textContent='视频无法加载，查看报告';resume.onclick=finish};
 video.ontimeupdate=()=>{if(Number.isFinite(video.duration)&&video.duration-video.currentTime<=3)finish()};
 await begin();
}
function showReport(){
 $('report-summary').textContent='Relative facial-expression cue scores, averaged separately for each scene. These are not emotion probabilities; a neutral expression can include unexpressed feelings. Transitions are excluded.';
 const container=$('report-average');container.replaceChildren();
 for(const [title,phases] of [['Scene A',['a_video','a_burn']],['Scene B',['b_video','b_read']]]){
  const records=emotionRows.filter(r=>phases.includes(r.phase));
  const valid=records.filter(r=>r.status==='face_detected'&&Object.keys(emojis).every(k=>r[k]!==''&&Number.isFinite(Number(r[k]))));
  const card=document.createElement('section');card.className='scene-report';
  const heading=document.createElement('h3');heading.textContent=title;card.append(heading);
  const info=document.createElement('p');info.className='sample-count';info.textContent=`${valid.length} valid face records / ${records.length} total records`;card.append(info);
  for(const k of Object.keys(emojis)){
   const average=valid.length?valid.reduce((sum,r)=>sum+Number(r[k]),0)/valid.length:null;
   const row=document.createElement('div');row.className='expression-row';
   const label=document.createElement('span');label.textContent=`${emojis[k]} ${k[0].toUpperCase()+k.slice(1)}`;
   const value=document.createElement('strong');value.textContent=average===null?'—':`${average.toFixed(1)}%`;
   const bar=document.createElement('div');bar.className='expression-bar';const fill=document.createElement('span');fill.style.width=`${Math.max(0,Math.min(100,average||0))}%`;bar.append(fill);
   row.append(label,value,bar);card.append(row);
  }
  if(!valid.length){const note=document.createElement('p');note.textContent='No valid face samples in this scene. Keep your face in camera view.';card.append(note)}
  container.append(card);
 }
 $('report-timeline').replaceChildren();emotionRows.forEach(r=>{const chip=document.createElement('span');chip.className='record-chip';chip.textContent=`${r.elapsed}s · ${r.phase} ${emojis[r.emotion]||'—'}`;$('report-timeline').append(chip)});
 $('report').hidden=false;
 startReportMusic();
 celebrateReport();
}
$('report-download').onclick=()=>$('export-emotions').click();
$('report-close').onclick=()=>{$('report').hidden=true};

window.addEventListener('pagehide',()=>{stopForest();forestAudio?.close();stopAmbience();audioCtx?.close();finishEmotionRecording();active=false;stream?.getTracks().forEach(t=>t.stop())});

<script>
(()=>{
 const audio=new Audio('./assets/cover/11月15日.mp3');audio.loop=true;audio.volume=0;
 let frame=0,leaving=false,playing=false,pending=false;
 function fade(target,ms,done){cancelAnimationFrame(frame);const from=audio.volume,t=performance.now();function tick(now){const k=Math.min(1,(now-t)/ms);audio.volume=from+(target-from)*k;if(k<1)frame=requestAnimationFrame(tick);else if(done)done()}frame=requestAnimationFrame(tick)}
 async function play(){if(leaving||playing||pending||document.getElementById('welcome').hidden)return;pending=true;try{await audio.play();if(leaving||document.getElementById('welcome').hidden){audio.pause();return}playing=true;fade(.65,2500)}catch(e){playing=false}finally{pending=false}}
 if(new URLSearchParams(location.search).get('preview')!=='report')play();
 document.addEventListener('ending-audio-only',()=>{leaving=true;cancelAnimationFrame(frame);audio.pause();audio.currentTime=0;playing=false});
 function unlock(e){if(e.target.closest&&e.target.closest('#start'))return;play()}
 document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);
 document.getElementById('start').addEventListener('click',()=>{leaving=true;fade(0,1000,()=>{audio.pause();audio.currentTime=0;playing=false})},true);
 document.getElementById('restart').addEventListener('click',()=>{leaving=false;play()});
 window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);audio.pause()});
})();
</script>
